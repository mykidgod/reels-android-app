name: rayworks_reels_studio
description: "Rayworks Reels Studio - Mobile Instagram Reels Automation App (Korean & Japanese Dual Support)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Google Gemini AI SDK
  google_generative_ai: ^0.4.6

  # Native Android FFmpeg Video Engine (ARM64 GPL Full)
  ffmpeg_kit_flutter_full_gpl: ^6.0.3

  # Media Selection & Storage
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2

  # Networking & Video Playing
  http: ^1.2.2
  video_player: ^2.9.2
  share_plus: ^10.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/templates/
    - assets/logos/
    - assets/fonts/
