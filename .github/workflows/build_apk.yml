name: Build Android APK (Release)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions web tab!

jobs:
  build:
    name: Build Rayworks Reels Studio APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository code
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter dependencies
        run: flutter pub get

      - name: 🔨 Build Release APK (Universal & ARM64)
        run: flutter build apk --release

      - name: 🚀 Upload APK Artifact for One-Click Download
        uses: actions/upload-artifact@v4
        with:
          name: RayworksReelsStudio-v1.0.0
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
