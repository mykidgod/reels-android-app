name: Build Android APK (Release)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Rayworks Reels Studio APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository code
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter dependencies
        run: flutter pub get

      - name: 🔨 Build Release APK (Universal & ARM64)
        run: flutter build apk --release

      - name: 🚀 Upload APK Artifact for One-Click Download
        uses: actions/upload-artifact@v4
        with:
          name: RayworksReelsStudio-v1.1.0
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🏷️ Publish Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.1.0
          name: "Rayworks Reels Studio v1.1.0 (Full Feature: Crop & Typography Match)"
          body: "윈도우용 프로그램의 모든 기능(비주얼 크롭 뷰파인더, 자동 감지 크롭, 정확한 1080x1920 투명 텍스트 정렬, 동적 Y좌표 배치, 무음 영상 감지 등)이 100% 동일하게 구현된 안드로이드 정식 릴리즈입니다."
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
